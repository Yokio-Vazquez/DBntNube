name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify reproducibility contract
        shell: bash
        working-directory: starter/cdrl-base
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          make setup
          make verify
