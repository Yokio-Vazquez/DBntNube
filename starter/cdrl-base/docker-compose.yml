services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me-bootstrap}
      DB_NAME: ${DB_NAME:-cdrl}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER_MIGRATOR: ${DB_USER_MIGRATOR:-cdrl_migrator}
      DB_PASSWORD_MIGRATOR: ${DB_PASSWORD_MIGRATOR:-replace-me-migrator}
      DB_USER_WRITER: ${DB_USER_WRITER:-cdrl_writer}
      DB_PASSWORD_WRITER: ${DB_PASSWORD_WRITER:-replace-me-writer}
      DB_USER_READER: ${DB_USER_READER:-cdrl_reader}
      DB_PASSWORD_READER: ${DB_PASSWORD_READER:-replace-me-reader}
      CDRL_MIGRATOR_PASSWORD: ${CDRL_MIGRATOR_PASSWORD:-replace-me-migrator}
      CDRL_WRITER_PASSWORD: ${CDRL_WRITER_PASSWORD:-replace-me-writer}
      CDRL_READER_PASSWORD: ${CDRL_READER_PASSWORD:-replace-me-reader}
      CDRL_OPERATOR_PASSWORD: ${CDRL_OPERATOR_PASSWORD:-replace-me-operator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

volumes:
  postgres_data:
  dynamodb_data:
